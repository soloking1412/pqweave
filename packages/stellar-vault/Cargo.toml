[package]
name = "pqweave-stellar-vault"
version = "0.1.0"
edition = "2021"
description = "PQWeave Stellar (Soroban) post-quantum vault: a custom account gated by a Lamport+Merkle one-time signature"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = "23"

[dev-dependencies]
soroban-sdk = { version = "23", features = ["testutils"] }
sha3 = "0.10"

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true
