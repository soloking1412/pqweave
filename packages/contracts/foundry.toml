[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc = "0.8.28"
optimizer = true
optimizer_runs = 200
evm_version = "prague"
bytecode_hash = "none"
ffi = false
fs_permissions = [{access = "read", path = "./test/vectors"}]

[rpc_endpoints]
base_sepolia = "${RPC_URL_BASE_SEPOLIA}"

[etherscan]
base_sepolia = {key = "${ETHERSCAN_API_KEY}", chain = 84532, url = "https://api-sepolia.basescan.org/api"}

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = false
int_types = "long"
