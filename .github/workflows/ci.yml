name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# A security tool whose tests nobody can see running is asking for trust it has
# not earned. Everything below runs on every push and is reproducible locally
# with the same commands.
jobs:
  sdk:
    name: SDK and web
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d # v4.1.0
        with:
          version: 9.15.9

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The SDK's exports map points at dist/, so the web app cannot typecheck
      # until the SDK is built. The `prepare` script means install already does
      # this, but doing it explicitly keeps a build failure reported as a build
      # failure rather than a confusing install failure.
      - name: Build SDK
        run: pnpm --filter @pqweave/sdk build

      - name: Format
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Audit runtime and development dependencies
        run: pnpm audit --audit-level low

      - name: SDK tests
        run: pnpm --filter @pqweave/sdk test

      - name: Install pinned Bitcoin Core integration runtime
        run: |
          curl --fail --location --retry 3 -o "$RUNNER_TEMP/bitcoin.tar.gz" https://bitcoincore.org/bin/bitcoin-core-29.1/bitcoin-29.1-x86_64-linux-gnu.tar.gz
          echo "2dddeaa8c0626ec446b6f21b64c0f3565a1e7e67ff0b586d25043cbd686c9455  $RUNNER_TEMP/bitcoin.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/bitcoin.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/bitcoin-29.1/bin" >> "$GITHUB_PATH"

      - name: Bitcoin Core signing, replacement, confirmation and recovery
        run: pnpm --filter @pqweave/sdk test:bitcoin-core

      - name: Web build
        run: pnpm --filter @pqweave/web build

      - name: Public HTTP boundary
        run: pnpm web:test

      - name: Build isolated Bitcoin release
        run: pnpm bitcoin:build

      - name: Audit isolated Bitcoin runtime dependencies
        run: pnpm --dir releases/bitcoin/site audit --prod --audit-level low

      - name: Test packaged Bitcoin server outside the repository
        run: pnpm bitcoin:test

  contracts:
    name: Contracts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: recursive

      - uses: foundry-rs/foundry-toolchain@de808b1eea699e761c404bda44ba8f21aba30b2c # v1.3.1
        with:
          version: v1.4.2

      - name: Format
        run: forge fmt --check
        working-directory: packages/contracts

      - name: Tests
        # Fork tests skip without RPC_URL_BASE_SEPOLIA, which is deliberate:
        # CI must not depend on a third-party endpoint being up.
        run: forge test --fuzz-runs 512 -vv
        working-directory: packages/contracts

  cross-runtime:
    name: TS and Solidity agree
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: recursive

      - uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d # v4.1.0
        with:
          version: 9.15.9

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - uses: foundry-rs/foundry-toolchain@de808b1eea699e761c404bda44ba8f21aba30b2c # v1.3.1
        with:
          version: v1.4.2

      - run: pnpm install --frozen-lockfile

      # A hash-based signature has to agree byte for byte across runtimes. One
      # differing byte in a tweak, a digit order or a leaf commitment invalidates
      # every signature, and the failure would only surface on chain. Regenerate
      # the vectors from the SDK and check the contracts still accept them.
      - name: Build SDK
        run: pnpm --filter @pqweave/sdk build

      - name: Compile Ethereum lifecycle contracts
        run: forge build
        working-directory: packages/contracts

      - name: Ethereum lifecycle on local Prague node
        run: pnpm --filter @pqweave/sdk test:ethereum

      - name: Regenerate cross-runtime vectors
        run: |
          node packages/sdk/scripts/gen-hashsig-vector.mjs
          node packages/sdk/scripts/gen-winternitz-vector.mjs

      - name: Vectors must be unchanged
        run: git diff --exit-code packages/contracts/test/vectors/

      - name: Contracts accept SDK-generated signatures
        run: forge test --match-contract CrossCompat -vv
        working-directory: packages/contracts
